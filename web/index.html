<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonsai Chat</title>
<style>
  :root {
    --bg: #ffffff; --side: #f9f9f9; --text: #0d0d0d; --muted: #6e6e6e;
    --line: #e5e5e5; --hover: #ececec; --bubble: #f4f4f4; --composer: #f4f4f4;
    --code-bg: #f6f6f6; --code-head: #ebebeb; --btn: #0d0d0d; --btn-text: #ffffff;
    --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #212121; --side: #171717; --text: #ececec; --muted: #a3a3a3;
      --line: #303030; --hover: #2a2a2a; --bubble: #303030; --composer: #303030;
      --code-bg: #171717; --code-head: #2a2a2a; --btn: #ffffff; --btn-text: #0d0d0d;
      --danger: #ff7b6b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #212121; --side: #171717; --text: #ececec; --muted: #a3a3a3;
    --line: #303030; --hover: #2a2a2a; --bubble: #303030; --composer: #303030;
    --code-bg: #171717; --code-head: #2a2a2a; --btn: #ffffff; --btn-text: #0d0d0d;
    --danger: #ff7b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 20px; height: 20px; flex: none; }

  /* ---------- sidebar ---------- */
  #side {
    width: 260px; flex: none; background: var(--side); display: flex; flex-direction: column;
    padding: 8px; transition: margin-left .2s;
  }
  body.side-closed #side { margin-left: -260px; }
  .side-top { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 10px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 4px 6px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .side-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 8px 10px; border-radius: 10px; font-size: 14px;
  }
  .side-item:hover, .side-item.active { background: var(--hover); }
  .side-label { color: var(--muted); font-size: 12px; padding: 16px 10px 4px; }
  #chats { flex: 1; overflow-y: auto; min-height: 0; }
  .chat-row { position: relative; }
  .chat-row .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .chat-row .del { display: none; position: absolute; right: 4px; top: 3px; width: 30px; height: 30px; }
  .chat-row:hover .del { display: grid; }
  .chat-row:hover .title { padding-right: 26px; }
  .side-foot { border-top: 1px solid var(--line); padding-top: 8px; font-size: 12px; color: var(--muted); }
  .side-foot .side-item { font-size: 13px; color: var(--text); }

  /* ---------- main ---------- */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  #top { display: flex; align-items: center; gap: 6px; padding: 8px 12px; height: 52px; flex: none; }
  #top .model { font-weight: 600; font-size: 17px; padding: 6px 8px; }
  #top .status { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #d9a441; }
  .dot.ok { background: #3fae6a; } .dot.bad { background: var(--danger); }
  #top .spacer { flex: 1; }
  body:not(.side-closed) #open-side { display: none; }

  #log { flex: 1; overflow-y: auto; min-height: 0; }
  .col { max-width: 768px; margin: 0 auto; padding: 0 16px; width: 100%; }
  #msgs { padding-top: 12px; padding-bottom: 24px; display: flex; flex-direction: column; gap: 22px; }
  .msg.user {
    align-self: flex-end; max-width: 75%; background: var(--bubble);
    padding: 10px 18px; border-radius: 22px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.assistant { overflow-wrap: anywhere; min-width: 0; }
  .msg.assistant.error .body { color: var(--danger); }
  .body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
  .body p { margin: 0 0 12px; }
  .body h1, .body h2, .body h3 { margin: 20px 0 8px; line-height: 1.3; }
  .body h1 { font-size: 1.4em; } .body h2 { font-size: 1.25em; } .body h3 { font-size: 1.1em; }
  .body ul, .body ol { margin: 0 0 12px; padding-left: 26px; }
  .body li { margin: 4px 0; }
  .body a { color: inherit; }
  .body code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font: 14px ui-monospace, Menlo, Consolas, monospace; }
  .body pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; margin: 0 0 12px; overflow: hidden; }
  .body pre .head { display: flex; justify-content: space-between; align-items: center; background: var(--code-head); padding: 4px 12px; font-size: 12px; color: var(--muted); }
  .body pre .head button { font-size: 12px; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
  .body pre .head button:hover { color: var(--text); background: var(--hover); }
  .body pre code { display: block; padding: 12px 14px; overflow-x: auto; border: 0; background: none; white-space: pre; line-height: 1.5; }
  details.think { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  details.think summary { cursor: pointer; width: fit-content; }
  details.think div { border-left: 2px solid var(--line); padding-left: 12px; margin-top: 6px; white-space: pre-wrap; }
  .tools { display: flex; align-items: center; gap: 2px; margin-top: 6px; color: var(--muted); font-size: 12px; min-height: 30px; }
  .tools .icon-btn { width: 30px; height: 30px; } .tools svg { width: 16px; height: 16px; }
  .tools .stat { margin-left: 6px; }
  .cursor::after { content: "●"; font-size: .7em; margin-left: 3px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  /* ---------- empty state ---------- */
  #empty { display: none; text-align: center; padding: 0 16px; }
  body.is-empty #log { display: flex; flex-direction: column; justify-content: flex-end; }
  body.is-empty #main { justify-content: center; }
  body.is-empty #log { flex: 0 0 auto; }
  body.is-empty #top { position: absolute; top: 0; left: 0; right: 0; }
  body.is-empty #empty { display: block; }
  body.is-empty #msgs { display: none; }
  #empty h2 { font-size: 28px; font-weight: 500; margin: 0 0 24px; }
  #chips { display: none; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  body.is-empty #chips { display: flex; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; color: var(--muted); }
  .chip:hover { background: var(--hover); color: var(--text); }

  /* ---------- composer ---------- */
  #composer { flex: none; padding-bottom: 8px; }
  .box {
    background: var(--composer); border-radius: 28px; padding: 10px 10px 10px 20px;
    display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
  }
  textarea {
    flex: 1; font: inherit; color: var(--text); background: none; border: 0; outline: 0;
    resize: none; max-height: 200px; padding: 6px 0; line-height: 1.5;
  }
  textarea::placeholder { color: var(--muted); }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); height: 36px; }
  .toggle.on { color: #2f7fd1; border-color: #2f7fd1; background: rgba(47,127,209,.12); }
  .toggle svg { width: 16px; height: 16px; }
  #send { width: 36px; height: 36px; border-radius: 50%; background: var(--btn); color: var(--btn-text); display: grid; place-items: center; }
  #send:disabled { opacity: .3; cursor: default; }
  #send svg { width: 18px; height: 18px; }
  .note { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 0 2px; }

  /* ---------- model menu + dialog ---------- */
  .model-wrap { position: relative; }
  #model-btn { display: flex; align-items: center; gap: 4px; font-weight: 600; font-size: 17px; padding: 6px 10px; border-radius: 10px; max-width: 46vw; }
  #model-btn:hover { background: var(--hover); }
  #model-btn span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #model-btn svg { width: 16px; height: 16px; color: var(--muted); }
  #model-menu {
    display: none; position: absolute; top: 44px; left: 0; z-index: 10; width: 320px; max-width: 86vw;
    background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18); max-height: 70vh; overflow-y: auto;
  }
  #model-menu.open { display: block; }
  .m-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 10px; font-size: 14px; }
  .m-item:hover { background: var(--hover); }
  .m-item .grow { flex: 1; min-width: 0; }
  .m-item .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .m-item .sub { color: var(--muted); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .m-item .check { width: 16px; height: 16px; visibility: hidden; }
  .m-item.sel .check { visibility: visible; }
  .m-sep { border-top: 1px solid var(--line); margin: 6px 4px; }
  dialog {
    border: 1px solid var(--line); border-radius: 18px; background: var(--bg); color: var(--text);
    width: 560px; max-width: calc(100vw - 32px); max-height: calc(100vh - 48px); padding: 0;
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px 20px; border-bottom: 1px solid var(--line); }
  .dlg-head h3 { margin: 0; font-size: 17px; }
  .dlg-body { padding: 16px 20px 20px; overflow-y: auto; }
  .dlg-body h4 { margin: 18px 0 6px; font-size: 14px; }
  .dlg-body h4:first-child { margin-top: 0; }
  .dlg-body p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; }
  .field { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--text); background: var(--composer); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .field:focus { outline: 2px solid #2f7fd1; outline-offset: -1px; }
  .btn { font-size: 14px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .list { border: 1px solid var(--line); border-radius: 10px; max-height: 210px; overflow-y: auto; margin-top: 8px; }
  .list:empty { display: none; }
  .list .li { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .list .li:last-child { border-bottom: 0; }
  .list .li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 18px; }
  .hint.err { color: var(--danger); }
  body.no-think #think { display: none; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab { border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; font-size: 13px; }
  .tab:hover { background: var(--hover); }
  .tab.on { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .tab .n { opacity: .65; margin-left: 4px; }

  @media (max-width: 720px) {
    #side { position: absolute; z-index: 5; height: 100%; box-shadow: 0 0 30px rgba(0,0,0,.3); }
    .msg.user { max-width: 88%; }
    #empty h2 { font-size: 23px; }
    .toggle span { display: none; }
  }
</style>
</head>
<body class="is-empty">

<aside id="side">
  <div class="side-top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 15c0-3-2-5-6-5 0 3 2 5 6 5z"/><path d="M8 21h8"/></svg>
      Bonsai
    </div>
    <button class="icon-btn" id="close-side" title="Close sidebar" aria-label="Close sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
  </div>
  <button class="side-item" id="new-chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    New chat
  </button>
  <div class="side-label">Chats</div>
  <div id="chats"></div>
  <div class="side-foot">
    <button class="side-item" id="open-settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.900 2.900l-.1-.1a1.7 1.7 0 0 0-2.900 1.200V21a2 2 0 1 1-4 0v-.1a1.700 1.700 0 0 0-2.900-1.200l-.1.1a2 2 0 1 1-2.900-2.900l.1-.1a1.700 1.700 0 0 0-1.200-2.900H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.200-2.900l-.1-.1a2 2 0 1 1 2.900-2.900l.1.1a1.700 1.700 0 0 0 2.900-1.200V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 2.900 1.200l.1-.1a2 2 0 1 1 2.900 2.900l-.1.1a1.700 1.700 0 0 0 1.200 2.900H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z"/></svg>
      Settings
    </button>
    <button class="side-item" id="theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span id="theme-label">Theme: auto</span>
    </button>
  </div>
</aside>

<main id="main">
  <div id="top">
    <button class="icon-btn" id="open-side" title="Open sidebar" aria-label="Open sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
    </button>
    <div class="model-wrap">
      <button id="model-btn" aria-haspopup="true" aria-expanded="false" title="Choose model">
        <span id="model-name">Bonsai 27B</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div id="model-menu" role="menu"></div>
    </div>
    <span class="status"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
    <span class="spacer"></span>
  </div>

  <div id="log"><div class="col">
    <div id="empty"><h2>How can I help today?</h2></div>
    <div id="msgs"></div>
  </div></div>

  <div id="composer"><div class="col">
    <form class="box" id="form">
      <textarea id="input" rows="1" placeholder="Ask anything" autofocus></textarea>
      <button type="button" class="toggle" id="think" title="Let the model reason before answering (slower)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.700 1-2.500A6 6 0 0 0 12 3z"/></svg>
        <span>Think</span>
      </button>
      <button id="send" type="submit" title="Send" aria-label="Send" disabled></button>
    </form>
    <div id="chips">
      <button class="chip">Explain how a 1-bit model works</button>
      <button class="chip">Write a Python function to reverse a string</button>
      <button class="chip">Give me 3 dinner ideas</button>
    </div>
    <div class="note" id="note"></div>
  </div></div>
</main>

<dialog id="models-dlg">
  <div class="dlg-head"><h3>Settings · Model providers</h3>
    <button class="icon-btn" id="dlg-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="dlg-body">
    <div class="tabs" id="tabs" role="tablist"></div>
    <p id="p-desc"></p>

    <div id="base-sec">
      <h4>Server address</h4>
      <form id="base-form" class="row">
        <input class="field" id="base-input" placeholder="http://localhost:11434/v1" autocomplete="off" spellcheck="false">
        <button class="btn" type="submit">Save</button>
      </form>
      <div class="hint" id="base-msg"></div>
    </div>

    <h4 id="key-title">API key</h4>
    <div id="key-saved" class="row" hidden>
      <span id="key-hint" style="flex:1;font-size:14px"></span>
      <button class="btn small" id="key-replace" type="button">Replace</button>
      <button class="btn small" id="key-remove" type="button">Remove</button>
    </div>
    <form id="key-form" class="row">
      <input class="field" id="key-input" type="password" autocomplete="off" spellcheck="false">
      <button class="btn primary" type="submit">Save key</button>
    </form>
    <div class="hint" id="key-msg"></div>

    <h4>Your models</h4>
    <p id="mine-empty">No models added yet.</p>
    <div class="list" id="mine"></div>

    <h4>Add a model</h4>
    <form id="add-form" class="row">
      <input class="field" id="add-input" autocomplete="off" spellcheck="false">
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="browse" type="button">Browse available models</button>
      <input class="field" id="filter" placeholder="Filter…" hidden>
    </div>
    <div class="hint" id="browse-msg"></div>
    <div class="list" id="catalog"></div>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const ICON = {
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  redo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.700"/><path d="M3 4v5h5"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>',
};
const SYSTEM = { role: 'system', content: 'You are a helpful assistant.' };
const input = $('input'), send = $('send'), msgsEl = $('msgs'), logEl = $('log');

/* ---------- storage (per-browser; the page works without it) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let chats = store.get('bonsai.chats', []);
let current = null;            // chat object being shown (null = unsaved new chat)
let controller = null;         // AbortController while generating
let thinkOn = store.get('bonsai.think', false);
const saveChats = () => store.set('bonsai.chats', chats);

/* ---------- theme ---------- */
const themes = ['auto', 'dark', 'light'];
let theme = store.get('bonsai.theme', 'auto');
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  $('theme-label').textContent = 'Theme: ' + theme;
}
$('theme').onclick = () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; store.set('bonsai.theme', theme); applyTheme(); };
applyTheme();

/* ---------- sidebar ---------- */
if (innerWidth <= 720) document.body.classList.add('side-closed');
$('close-side').onclick = () => document.body.classList.add('side-closed');
$('open-side').onclick = () => document.body.classList.remove('side-closed');
$('new-chat').onclick = () => { openChat(null); if (innerWidth <= 720) document.body.classList.add('side-closed'); };

function renderSide() {
  const box = $('chats'); box.innerHTML = '';
  for (const c of [...chats].sort((a, b) => b.ts - a.ts)) {
    const row = document.createElement('div'); row.className = 'chat-row';
    const b = document.createElement('button');
    b.className = 'side-item' + (c === current ? ' active' : '');
    const t = document.createElement('span'); t.className = 'title'; t.textContent = c.title;
    b.append(t); b.onclick = () => { openChat(c); if (innerWidth <= 720) document.body.classList.add('side-closed'); };
    const del = document.createElement('button'); del.className = 'icon-btn del'; del.title = 'Delete chat';
    del.setAttribute('aria-label', 'Delete chat'); del.innerHTML = ICON.trash;
    del.onclick = () => { chats = chats.filter(x => x !== c); saveChats(); if (c === current) openChat(null); else renderSide(); };
    row.append(b, del); box.append(row);
  }
}

function openChat(c) {
  controller?.abort();
  current = c;
  msgsEl.innerHTML = '';
  if (c) for (const m of c.messages) addMsg(m.role, m.content, m.thinking, m.stat);
  document.body.classList.toggle('is-empty', !c || !c.messages.length);
  renderSide(); markLast(); scrollDown(true); input.focus();
}

/* ---------- small, safe markdown renderer ---------- */
const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function md(src) {
  const parts = src.split(/```/);
  let html = '';
  parts.forEach((part, i) => {
    if (i % 2) {                                   // fenced code
      const nl = part.indexOf('\n');
      const lang = nl >= 0 ? part.slice(0, nl).trim() : '';
      const code = (nl >= 0 ? part.slice(nl + 1) : part).replace(/\n$/, '');
      html += '<pre><div class="head"><span>' + esc(lang || 'code') + '</span><button type="button" data-copy>Copy</button></div><code>' + esc(code) + '</code></pre>';
      return;
    }
    let list = null, para = [];
    const flushP = () => { if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
    const flushL = () => { if (list) { html += '</' + list + '>'; list = null; } };
    for (const line of part.split('\n')) {
      let m;
      if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flushP(); flushL(); html += '<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'; }
      else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { flushP(); if (list !== 'ul') { flushL(); html += '<ul>'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if (list !== 'ol') { flushL(); html += '<ol>'; list = 'ol'; } html += '<li>' + inline(m[1]) + '</li>'; }
      else if (!line.trim()) { flushP(); flushL(); }
      else { flushL(); para.push(line); }
    }
    flushP(); flushL();
  });
  return html;
}

/* ---------- messages ---------- */
function addMsg(role, text, thinking, stat) {
  const el = document.createElement('div'); el.className = 'msg ' + role;
  if (role === 'user') { el.textContent = text; msgsEl.append(el); return el; }
  const think = document.createElement('details'); think.className = 'think'; think.hidden = !thinking;
  think.innerHTML = '<summary>Thought process</summary><div></div>'; think.lastChild.textContent = thinking || '';
  const body = document.createElement('div'); body.className = 'body'; body.innerHTML = md(text || '');
  const tools = document.createElement('div'); tools.className = 'tools';
  const copy = document.createElement('button'); copy.className = 'icon-btn'; copy.title = 'Copy'; copy.setAttribute('aria-label', 'Copy reply'); copy.innerHTML = ICON.copy;
  copy.onclick = () => navigator.clipboard?.writeText(el._text || '');
  const redo = document.createElement('button'); redo.className = 'icon-btn redo'; redo.title = 'Regenerate'; redo.setAttribute('aria-label', 'Regenerate reply'); redo.innerHTML = ICON.redo;
  redo.onclick = regenerate;
  const st = document.createElement('span'); st.className = 'stat'; st.textContent = stat || '';
  tools.append(copy, redo, st);
  el.append(think, body, tools); el._text = text || '';
  msgsEl.append(el);
  return el;
}
function markLast() {   // only the newest reply can be regenerated
  const all = msgsEl.querySelectorAll('.msg.assistant .redo');
  all.forEach((b, i) => b.style.display = i === all.length - 1 ? '' : 'none');
}
msgsEl.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  navigator.clipboard?.writeText(b.closest('pre').querySelector('code').textContent);
  b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200);
});
function scrollDown(force) {
  if (force || logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 140) logEl.scrollTop = logEl.scrollHeight;
}

/* ---------- composer ---------- */
function setBusy(b) { send.innerHTML = b ? ICON.stop : ICON.up; send.title = b ? 'Stop' : 'Send'; send.setAttribute('aria-label', send.title); syncSend(); }
function syncSend() { send.disabled = !controller && !input.value.trim(); }
function syncThink() { $('think').classList.toggle('on', thinkOn); $('think').setAttribute('aria-pressed', thinkOn); }
$('think').onclick = () => { thinkOn = !thinkOn; store.set('bonsai.think', thinkOn); syncThink(); };
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; syncSend(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!controller) $('form').requestSubmit(); } });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => { input.value = c.textContent; syncSend(); $('form').requestSubmit(); });
$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }
  const text = input.value.trim(); if (!text) return;
  input.value = ''; input.style.height = 'auto';
  if (!current) { current = { id: Date.now(), title: text.slice(0, 48), messages: [], ts: Date.now() }; chats.push(current); }
  current.messages.push({ role: 'user', content: text }); current.ts = Date.now();
  saveChats(); renderSide();
  document.body.classList.remove('is-empty');
  addMsg('user', text);
  generate();
});
function regenerate() {
  if (controller || !current) return;
  const last = current.messages.at(-1);
  if (last?.role === 'assistant') { current.messages.pop(); msgsEl.lastElementChild?.remove(); }
  else if (msgsEl.lastElementChild?.classList.contains('assistant')) msgsEl.lastElementChild.remove();
  generate();
}

async function generate() {
  const chat = current;
  const el = addMsg('assistant', '');
  const think = el.querySelector('.think'), body = el.querySelector('.body'), stat = el.querySelector('.stat');
  body.classList.add('cursor'); markLast(); scrollDown(true);
  controller = new AbortController(); setBusy(true);
  let answer = '', thinking = '', tokens = 0, failed = false;
  const t0 = performance.now();
  const who = parseModel(model) ? (providerOf(parseModel(model).pid)?.name || 'the provider') : 'Bonsai';
  const waiting = setInterval(() => {      // so a queued or slow model never looks dead
    if (tokens) return;
    const s = Math.round((performance.now() - t0) / 1000);
    stat.textContent = 'Waiting for ' + who + '… ' + s + 's' + (s >= 20 && who !== 'Bonsai' ? ' — this model looks busy or queued on their side; Stop and try another model if it does not start.' : '');
  }, 1000);
  try {
    const sel = parseModel(model), prov = sel && providerOf(sel.pid);
    const payload = { messages: [SYSTEM, ...chat.messages.map(m => ({ role: m.role, content: m.content }))], stream: true };
    if (sel) { payload.model = sel.id; payload.think = thinkOn; }
    else Object.assign(payload, { temperature: 0.7, top_p: 0.95, top_k: 20, max_tokens: 2048, chat_template_kwargs: { enable_thinking: thinkOn } });
    el._model = shortName(model);
    const r = await fetch(sel ? '/p/' + sel.pid + '/chat' : '/v1/chat/completions', {
      method: 'POST', signal: controller.signal, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!r.ok) {
      const raw = await r.text(); let msg = raw.slice(0, 300);
      try { let j = JSON.parse(raw); if (Array.isArray(j)) j = j[0]; msg = j.error?.message || j.detail || j.title || msg; } catch {}
      throw new Error((prov ? prov.name + ' error' : 'Model server error') + ' (' + r.status + '): ' + msg);
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ') || line.startsWith('data: [DONE]')) continue;
        let d; try { d = JSON.parse(line.slice(6)).choices?.[0]?.delta || {}; } catch { continue; }
        const rc = d.reasoning_content || d.reasoning;
        if (rc) { thinking += rc; tokens++; think.hidden = false; think.firstChild.textContent = 'Thinking…'; think.lastChild.textContent = thinking; }
        if (d.content) { answer += d.content; tokens++; body.innerHTML = md(answer); el._text = answer; }
        stat.textContent = (tokens / ((performance.now() - t0) / 1000)).toFixed(1) + ' tokens/s · ' + el._model;
        scrollDown();
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      failed = true; el.classList.add('error');
      body.textContent = err instanceof TypeError ? 'Could not reach Bonsai Chat\'s server. Start it again with the Bonsai Chat launcher.' : String(err.message || err);
    }
  }
  clearInterval(waiting); if (!tokens) stat.textContent = '';
  body.classList.remove('cursor');
  if (!think.hidden) think.firstChild.textContent = 'Thought process';
  if (!failed && !answer) body.textContent = controller.signal.aborted ? (thinking ? '(stopped while thinking)' : '(stopped)')
    : thinking ? '(The model used its whole reply on thinking and gave no answer. Turn Think off or ask again.)' : '(The model sent an empty reply.)';
  if (answer) { chat.messages.push({ role: 'assistant', content: answer, thinking, stat: stat.textContent }); chat.ts = Date.now(); saveChats(); }
  controller = null; setBusy(false); markLast(); input.focus();
}

/* ---------- server status ---------- */
let local = { state: '', label: 'connecting…' };
async function health() {
  local = { state: 'bad', label: 'server not running' };
  try {
    const r = await fetch('/health');
    local = r.ok ? { state: 'ok', label: 'ready' }
          : r.status === 503 && !(await r.text()).includes('Loading') ? { state: 'bad', label: 'local model not running' }
          : { state: '', label: 'loading model…' };
  } catch {}
  renderStatus();
  setTimeout(health, local.state === 'ok' ? 15000 : 2500);
}
function renderStatus() {
  const sel = parseModel(model), prov = sel && providerOf(sel.pid);
  const missing = prov && prov.needs_key && !prov.has_key;
  $('dot').className = 'dot ' + (prov ? (missing ? 'bad' : 'ok') : local.state);
  $('status').textContent = prov ? (missing ? 'API key missing' : prov.name) : local.label;
  $('note').textContent = !prov ? 'Bonsai runs locally on your CPU — replies are private but can be slow.'
    : prov.base_editable ? 'This model runs on your own server at ' + prov.base_url + '.'
    : 'This model runs on ' + prov.name + '\'s servers — your messages are sent over the internet.';
  document.body.classList.toggle('no-think', !!prov && !prov.think_toggle);
}

/* ---------- models: built-in Bonsai + providers (OpenAI, Gemini, Anthropic, NVIDIA, local LLM) ---------- */
let settings = { providers: [] };
let model = store.get('bonsai.model', 'bonsai');      // 'bonsai' or '<provider>:<model id>'
let tab = store.get('bonsai.tab', 'openai');
const catalogs = {};
const providerOf = pid => settings.providers.find(p => p.id === pid);
const parseModel = m => { const i = m.indexOf(':'); return m === 'bonsai' || i < 0 ? null : { pid: m.slice(0, i), id: m.slice(i + 1) }; };
const shortName = m => { const s = parseModel(m); return s ? s.id.split('/').pop() : 'Bonsai 27B'; };
const validModel = m => { const s = parseModel(m); return !s ? m === 'bonsai' : !!providerOf(s.pid)?.models.includes(s.id); };
const CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';

async function loadSettings() {
  try { const r = await fetch('/api/settings'); if (r.ok) settings = await r.json(); } catch {}
  if (!validModel(model)) model = 'bonsai';
  if (!providerOf(tab)) tab = settings.providers[0]?.id || 'openai';
  renderModels();
}
async function saveSettings(patch) {   // returns '' on success, otherwise an error message
  try {
    const r = await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ provider: tab, ...patch }) });
    const j = await r.json();
    if (!r.ok) return j.error?.message || 'Could not save.';
    settings = j;
  } catch { return 'Could not save — is the Bonsai Chat server running?'; }
  if (!validModel(model)) setModel('bonsai'); else renderModels();
  return '';
}
function setModel(m) { model = m; store.set('bonsai.model', m); renderModels(); }

function menuItem(name, sub, selected, onclick) {
  const b = document.createElement('button'); b.className = 'm-item' + (selected ? ' sel' : ''); b.setAttribute('role', 'menuitem');
  const g = document.createElement('div'); g.className = 'grow';
  const n = document.createElement('div'); n.className = 'name'; n.textContent = name;
  const s = document.createElement('div'); s.className = 'sub'; s.textContent = sub;
  g.append(n, s); b.append(g); b.insertAdjacentHTML('beforeend', CHECK); b.onclick = onclick;
  return b;
}
function renderModels() {
  $('model-name').textContent = shortName(model);
  const menu = $('model-menu'); menu.innerHTML = '';
  menu.append(menuItem('Bonsai 27B', 'Built in · runs on this PC', model === 'bonsai', () => { setModel('bonsai'); toggleMenu(false); }));
  for (const p of settings.providers) for (const id of p.models) {
    const m = p.id + ':' + id;
    menu.append(menuItem(shortName(m), p.name + ' · ' + id, model === m, () => { setModel(m); toggleMenu(false); }));
  }
  const sep = document.createElement('div'); sep.className = 'm-sep';
  menu.append(sep, menuItem('Add models…', 'OpenAI, Gemini, Anthropic, NVIDIA or a local LLM', false, () => { toggleMenu(false); openDialog(); }));
  renderStatus(); renderDialog();
}
function toggleMenu(open) {
  const m = $('model-menu'); open = open ?? !m.classList.contains('open');
  m.classList.toggle('open', open); $('model-btn').setAttribute('aria-expanded', open);
}
$('model-btn').onclick = e => { e.stopPropagation(); toggleMenu(); };
document.addEventListener('click', e => { if (!e.target.closest('.model-wrap')) toggleMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleMenu(false); });

/* settings dialog */
const dlg = $('models-dlg');
let editingKey = false;
const hint = (id, text, bad) => { $(id).className = 'hint' + (bad ? ' err' : ''); $(id).textContent = text; };
function openDialog() { selectTab(tab); dlg.showModal(); }
function selectTab(pid) {
  tab = pid; store.set('bonsai.tab', pid); editingKey = false;
  hint('key-msg', ''); hint('base-msg', ''); hint('browse-msg', '');
  $('key-input').value = ''; $('add-input').value = ''; $('filter').value = '';
  renderDialog();
}
$('open-settings').onclick = openDialog;
$('dlg-close').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

function listRow(text, label, onclick, disabled) {
  const li = document.createElement('div'); li.className = 'li';
  const s = document.createElement('span'); s.textContent = text;
  const b = document.createElement('button'); b.className = 'btn small'; b.type = 'button'; b.textContent = label; b.disabled = !!disabled; b.onclick = onclick;
  li.append(s, b); return li;
}
function renderDialog() {
  const p = providerOf(tab); if (!p) return;
  const tabs = $('tabs'); tabs.innerHTML = '';
  for (const q of settings.providers) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tab' + (q.id === tab ? ' on' : '');
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', q.id === tab); b.textContent = q.name;
    if (q.models.length) { const n = document.createElement('span'); n.className = 'n'; n.textContent = q.models.length; b.append(n); }
    b.onclick = () => selectTab(q.id); tabs.append(b);
  }
  $('p-desc').textContent = p.desc + (p.base_editable ? '' : ' It is saved only on this PC and sent only to ' + p.name + '.');
  $('base-sec').hidden = !p.base_editable;
  if (p.base_editable && document.activeElement !== $('base-input')) $('base-input').value = p.base_url;
  $('key-title').textContent = p.needs_key ? 'API key' : 'API key (optional)';
  $('key-saved').hidden = !p.has_key || editingKey;
  $('key-form').hidden = p.has_key && !editingKey;
  $('key-input').placeholder = p.key_ph; $('add-input').placeholder = p.model_ph;
  $('key-hint').textContent = 'Key saved' + (p.key_hint ? ' (ends in …' + p.key_hint + ')' : '');
  const mine = $('mine'); mine.innerHTML = '';
  for (const id of p.models) mine.append(listRow(id, 'Remove', () => saveSettings({ models: p.models.filter(x => x !== id) })));
  $('mine-empty').hidden = p.models.length > 0;
  renderCatalog();
}
function renderCatalog() {
  const box = $('catalog'), p = providerOf(tab), cat = catalogs[tab]; box.innerHTML = '';
  $('filter').hidden = !cat;
  if (!cat || !p) return;
  const q = $('filter').value.trim().toLowerCase();
  const hits = cat.filter(id => id.toLowerCase().includes(q));
  for (const id of hits.slice(0, 300)) {
    const added = p.models.includes(id);
    box.append(listRow(id, added ? 'Added' : 'Add', () => addModel(id), added));
  }
  hint('browse-msg', hits.length + ' of ' + cat.length + ' models' + (hits.length > 300 ? ' (showing the first 300 — type to filter)' : '') + '. Not every listed model supports chat.');
}
async function addModel(id) {
  const p = providerOf(tab); id = id.trim();
  if (!p || !id || p.models.includes(id)) return;
  const pid = tab, e = await saveSettings({ models: [...p.models, id] });
  if (e) hint('browse-msg', e, true); else setModel(pid + ':' + id);
}
$('key-form').addEventListener('submit', async e => {
  e.preventDefault();
  const key = $('key-input').value.trim(); if (!key) return;
  const err = await saveSettings({ key });
  $('key-input').value = ''; editingKey = !!err;
  hint('key-msg', err || 'Key saved on this PC.', !!err);
  renderDialog();
});
$('key-replace').onclick = () => { editingKey = true; renderDialog(); $('key-input').focus(); };
$('key-remove').onclick = async () => { const err = await saveSettings({ key: '' }); hint('key-msg', err || 'Key removed.', !!err); };
$('base-form').addEventListener('submit', async e => {
  e.preventDefault();
  const err = await saveSettings({ base_url: $('base-input').value });
  delete catalogs[tab]; hint('base-msg', err || 'Server address saved.', !!err); renderDialog();
});
$('add-form').addEventListener('submit', e => { e.preventDefault(); addModel($('add-input').value); $('add-input').value = ''; });
$('filter').addEventListener('input', renderCatalog);
$('browse').onclick = async () => {
  const pid = tab; hint('browse-msg', 'Loading the model list…');
  try {
    const r = await fetch('/p/' + pid + '/models'); const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || j.detail || j.title || ('Error ' + r.status));
    catalogs[pid] = (j.data || []).map(m => m.id).filter(Boolean);
    if (pid === tab) { renderCatalog(); $('filter').focus(); }
  } catch (err) { if (pid === tab) hint('browse-msg', String(err.message || err), true); }
};

setBusy(false); syncThink(); renderSide(); renderModels(); loadSettings(); health();
</script>
</body>
</html>
